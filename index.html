<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shotby.artana | Contact Detail</title>

<style>
/* =====================
   RESET
===================== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    padding: 20px;

    background:
        radial-gradient(circle at 20% 20%, rgba(255, 0, 150, 0.25), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(140, 0, 255, 0.35), transparent 45%),
        linear-gradient(135deg, #050505, #0b0b0b);
}

/* =====================
   GLASS CONTAINER
===================== */
.container {
    width: 100%;
    max-width: 420px;
    padding: 28px 22px;
    text-align: center;

    background-color: rgba(255,255,255,0.12);
    background-image: linear-gradient(
        135deg,
        rgba(255,255,255,0.22),
        rgba(255,255,255,0.08)
    );

    backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);

    border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.25);

    box-shadow:
        0 30px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(255,255,255,0.3);
}

/* =====================
   PROFILE
===================== */
.profile-img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 16px;

    border: 2px solid rgba(255,255,255,0.5);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.username {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
}

.bio {
    font-size: 14px;
    color: rgba(255,255,255,0.75);
    line-height: 1.6;
    margin-bottom: 26px;
}

/* =====================
   BUTTONS (IOS SAFE)
===================== */
.links {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.link-btn {
    padding: 16px;
    border-radius: 999px;
    text-decoration: none;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    text-align: center;

    background: linear-gradient(
        135deg,
        #1a1a1a,
        #2b2b2b
    );

    border: 1px solid rgba(255,255,255,0.18);

    box-shadow:
        0 10px 25px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.15);

    transition: transform .25s ease, box-shadow .25s ease;
}

/* CTA utama */
.link-btn.primary {
    background: linear-gradient(
        135deg,
        #ff2a6d,
        #a855f7
    );

    border: none;

    box-shadow:
        0 12px 30px rgba(168,85,247,0.45);
}

/* Hover desktop */
@media (hover: hover) {
    .link-btn:hover {
        transform: translateY(-4px);

        background: linear-gradient(
            135deg,
            #2a2a2a,
            #3a3a3a
        );

        box-shadow:
            0 18px 40px rgba(0,0,0,0.65),
            inset 0 1px 0 rgba(255,255,255,0.25);
    }

    .link-btn.primary:hover {
        background: linear-gradient(
            135deg,
            #ff4d88,
            #b56cff
        );
    }
}

/* =====================
   FOOTER
===================== */
.footer {
    margin-top: 28px;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
}
</style>
</head>

<body>

<div class="container">
    <img src="logo.jpg" alt="ShootByArtanaLogo" class="profile-img">

    <div class="username">shotby.artana</div>

    <div class="bio">
        Photo & Videographer Based in Bali Island ✨<br>
        #CaptureTheMomentKeepTheMemory
    </div>

    <div class="links">
        <a href="https://wa.me/6287701117408" class="link-btn primary">
            Chat With Us Now! 📞💬
        </a>

        <a href="#" class="link-btn">Portfolio Graduation</a>
        <a href="#" class="link-btn">Portfolio Wedding</a>
        <a href="https://instagram.com/shotby.artana" target="_blank" class="link-btn">
            IG : shotby.artana
        </a>
        <a href="https://instagram.com/graduationby.artana" target="_blank" class="link-btn">
            IG : graduationby.artana
        </a>
    </div>

    <div class="footer">
        Copyright © 2026 shotby.artana
    </div>
</div>

</body>
</html>
